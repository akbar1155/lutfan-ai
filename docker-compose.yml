services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lutfan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lutfan}
      POSTGRES_DB: ${POSTGRES_DB:-lutfan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lutfan} -d ${POSTGRES_DB:-lutfan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/lutfan-public || true;
      mc mb -p local/lutfan-private || true;
      mc anonymous set download local/lutfan-public || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}

  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://lutfan:lutfan@postgres:5432/lutfan
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_PUBLIC: lutfan-public
      S3_BUCKET_PRIVATE: lutfan-private
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      CDN_BASE_URL: http://minio:9000/lutfan-public
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      NANO_BANANA_MODEL: ${NANO_BANANA_MODEL:-gemini-2.5-flash-image}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-lutfan_ai_bot}
      JWT_ACCESS_SECRET: change-me-access-secret-min-64-chars-xxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-64-chars-xxxxxxxxxxxxxxx
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  backend-init:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed_data"
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://lutfan:lutfan@postgres:5432/lutfan
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_PUBLIC: lutfan-public
      S3_BUCKET_PRIVATE: lutfan-private
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      CDN_BASE_URL: http://minio:9000/lutfan-public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-lutfan_ai_bot}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      NANO_BANANA_MODEL: ${NANO_BANANA_MODEL:-gemini-2.5-flash-image}
      JWT_ACCESS_SECRET: change-me-access-secret-min-64-chars-xxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-64-chars-xxxxxxxxxxxxxxx
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://lutfan:lutfan@postgres:5432/lutfan
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_PUBLIC: lutfan-public
      S3_BUCKET_PRIVATE: lutfan-private
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      CDN_BASE_URL: http://minio:9000/lutfan-public
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      NANO_BANANA_MODEL: ${NANO_BANANA_MODEL:-gemini-2.5-flash-image}
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
