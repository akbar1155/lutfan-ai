map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    absolute_redirect off;
    port_in_redirect on;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — React admin UI lives at /admin/
    # Django admin is exposed at /django-admin/ only.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /django-admin {
        return 301 /django-admin/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /media/ {
        alias /var/lutfan-media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Django admin / DRF static assets (shared volume with backend collectstatic)
    location /static/ {
        alias /var/lutfan-static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
