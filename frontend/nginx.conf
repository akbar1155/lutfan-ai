map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    absolute_redirect off;
    port_in_redirect on;

    root /usr/share/nginx/html;
    index index.html;

    # index.html - never cache (always check for updates)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed assets (JS, CSS with hash in filename) - cache aggressively
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|jpg|jpeg|png|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback. Do not use $uri/ — a public/ directory with the same name as a
    # React route (e.g. /page-builder) would 403 instead of serving the app.
    # Django admin is /django-admin/; React admin is /admin/.
    location / {
        try_files $uri /index.html;
    }

    location ^~ /page-builder {
        try_files /index.html =404;
    }

    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /django-admin {
        return 301 /django-admin/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /media/ {
        alias /var/lutfan-media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Public MinIO bucket (admin JPG uploads live here as s3://lutfan-public/...)
    # CDN_BASE_URL should be https://lutfanai.uz/s3
    location /s3/ {
        proxy_pass http://minio:9000/lutfan-public/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_buffering on;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Django admin / DRF static assets (shared volume with backend collectstatic)
    location /static/ {
        alias /var/lutfan-static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
